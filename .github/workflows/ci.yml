name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, test, architecture
    # Package.swift requires Swift tools 6.0; the macos-14 image only ships
    # Swift 5.10, so pin a newer image and assert the toolchain below.
    # (Do not "modernise" this to macos-14: it will not build.)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swift --version
          xcode-select -p
          # Fail loudly if the runner image ever regresses below what
          # Package.swift requires, instead of a cryptic manifest error.
          major=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9]*\).*/\1/p' | head -1)
          if [ "${major:-0}" -lt 6 ]; then
            echo "::error::Nymbra requires Swift 6 or newer (found: ${major:-unknown})"
            exit 1
          fi
          echo "Swift major OK: $major"

      - name: Architecture guard
        run: |
          chmod +x Scripts/check-architecture.sh
          ./Scripts/check-architecture.sh

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift run -c release NymbraCheck

      - name: PTY smoke test
        run: |
          .build/release/Nymbra --pty-test > pty.out || true
          grep -q "PTY_OK" pty.out
          grep -q "TERM=xterm-256color" pty.out
          echo "PTY smoke test passed"

      - name: Docs present
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CHANGELOG.md \
                   docs/ARCHITECTURE.md docs/ROADMAP.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "docs OK"
