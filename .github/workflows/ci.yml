name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly fuzz + emulation run: catches regressions that land between
    # commits without waiting for a push or pull request.
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, test, architecture
    # Package.swift requires Swift tools 6.0; the macos-14 image only ships
    # Swift 5.10, so pin a newer image and assert the toolchain below.
    # (Do not "modernise" this to macos-14: it will not build.)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Toolchain
        run: |
          swift --version
          xcode-select -p
          # Fail loudly if the runner image ever regresses below what
          # Package.swift requires, instead of a cryptic manifest error.
          major=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9]*\).*/\1/p' | head -1)
          if [ "${major:-0}" -lt 6 ]; then
            echo "::error::Nymbra requires Swift 6 or newer (found: ${major:-unknown})"
            exit 1
          fi
          echo "Swift major OK: $major"

      - name: Architecture guard
        run: |
          chmod +x Scripts/check-architecture.sh
          ./Scripts/check-architecture.sh

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift run -c release NymbraCheck

      - name: PTY smoke test
        run: |
          # `--pty-test` runs a real login shell on a real PTY and prints every
          # byte it produced. stderr is captured too: it names the resolved shell
          # and the number of bytes read, which is what turns "no output" into a
          # diagnosis rather than a guess.
          echo "SHELL=${SHELL:-<unset>}"
          .build/release/Nymbra --pty-test > pty.out 2> pty.err &
          pid=$!
          for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            echo "::error::--pty-test did not finish within 30 seconds"
          fi
          wait "$pid" 2>/dev/null || true
          cat pty.err >&2 || true

          check() {
            if grep -q "$1" pty.out; then
              echo "  ok    $2"
            else
              echo "::error::$2"
              echo "--- pty.out ($(wc -c < pty.out | tr -d ' ') bytes) ---"
              cat -v pty.out
              exit 1
            fi
          }
          check "PTY_OK" "the shell ran the command we typed"
          check "TERM=xterm-256color" "the shell inherited TERM from the terminal"
          echo "PTY smoke test passed"

      # Correctness of the emulator, asserted without a window. The script
      # spawns real shells on real PTYs; `make check` runs the identical script.
      - name: Emulation checks
        run: |
          chmod +x Scripts/emulation-checks.sh
          ./Scripts/emulation-checks.sh

      # The grid the shell is told about is invisible to a test runner, and
      # transposing its two dimensions is silent: the shell then formats its
      # output for a width equal to the window's height and every wide line wraps
      # mid-field, which looks like a renderer fault. No window is created here,
      # only a view, and it is never drawn.
      - name: Grid agreement
        run: .build/release/Nymbra --resize-test

      # Closing the window with the red button used to leave the application
      # running with no window and no way to make one — the only route back to a
      # terminal was to quit. This closes a window, reopens it, and requires the
      # new shell to run a command. No window is ever shown.
      - name: Reopen after close
        run: |
          .build/release/Nymbra --window-test > window.out 2> window.err &
          pid=$!
          for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            echo "::error::--window-test did not finish"
          fi
          wait "$pid" 2>/dev/null || true
          cat window.err >&2 || true
          cat window.out
          grep -q "closed=true reopened=true shellAlive=true ranCommand=true" window.out \
            || { echo "::error::a closed window did not come back with a working shell"; exit 1; }
          echo "Reopen after close passed"

      # Tabs: a strip you can see, and a shell in each that no other tab can
      # disturb. No window is shown.
      - name: Tabs
        run: |
          .build/release/Nymbra --tabs-test > tabs.out 2> tabs.err &
          pid=$!
          for _ in $(seq 1 45); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            echo "::error::--tabs-test did not finish"
          fi
          wait "$pid" 2>/dev/null || true
          cat tabs.err >&2 || true
          cat tabs.out
          grep -q "strip=1 plus=1 created=1 ownShells=1 independent=1 switched=1 " tabs.out \
            || { echo "::error::tabs did not work"; exit 1; }
          grep -q "title=1 unread=1 closed=2 sameShells=1 lastTabClosesWindow=1" tabs.out \
            || { echo "::error::tabs did not work"; exit 1; }
          echo "Tabs passed"

      # Shell integration: a real zsh, started the way Nymbra starts one, has to
      # say what it is doing — and still run the user's own startup file. No
      # window is shown, and the stand-in for the config is a temp directory.
      - name: Shell integration
        run: |
          .build/release/Nymbra --shell-integration-test > integration.out 2> integration.err &
          pid=$!
          for _ in $(seq 1 45); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            echo "::error::--shell-integration-test did not finish"
          fi
          wait "$pid" 2>/dev/null || true
          cat integration.err >&2 || true
          cat integration.out
          grep -q "prompt=1 executed=1 finished=1 failed=1 userConfig=1" integration.out \
            || { echo "::error::shell integration did not report what zsh was doing"; exit 1; }
          echo "Shell integration passed"

      # A notification when a long command finishes. The length of a command is
      # what the shell's own marks measure, so this needs a real zsh too — and the
      # notification is never actually posted here, because a bare executable has
      # no bundle to post from. What is asserted is the decision.
      - name: Notification for a long command
        run: |
          .build/release/Nymbra --notify-test > notify.out 2> notify.err &
          pid=$!
          for _ in $(seq 1 45); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            echo "::error::--notify-test did not finish"
          fi
          wait "$pid" 2>/dev/null || true
          cat notify.err >&2 || true
          cat notify.out
          grep -q "announced=1 measured=1 tab=1 failed=1 quiet=1 off=1 click=1 ignored=1" notify.out \
            || { echo "::error::a long command was not announced as it should be"; exit 1; }
          echo "Notification passed"

      - name: Docs present
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CHANGELOG.md \
                   docs/ARCHITECTURE.md docs/ROADMAP.md docs/CONFIG.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "docs OK"
